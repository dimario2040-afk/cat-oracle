services:
  - type: web
    name: cat-oracle
    env: python
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/playwright-browsers python -m playwright install chromium && curl -sL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz && tar -xf ffmpeg.tar.xz && mv ffmpeg-*/ffmpeg ./ && chmod +x ffmpeg && pip install -r requirements.txt
    startCommand: python bot.py
    runtime: python
    pythonVersion: 3.12.0
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/playwright-browsers
